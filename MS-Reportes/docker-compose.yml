services:
  mysql:
    image: mysql:8.4
    container_name: db_reportes
    restart: unless-stopped
    command: --innodb-buffer-pool-size=32M --performance-schema=OFF --max-connections=50
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-ms_reportes}
      MYSQL_USER: ${DB_USER:-ms_reportes}
      MYSQL_PASSWORD: ${DB_PASSWORD:-reportes_secret_2026}
    ports:
      - "127.0.0.1:33065:3306"
    volumes:
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ms_reportes_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - redapi

volumes:
  ms_reportes_mysql:

networks:
  redapi:
    name: redapi
    driver: bridge
