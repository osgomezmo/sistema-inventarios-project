services:
  app:
    build: .
    image: ms-proveedores:dev
    container_name: ms-proveedores-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3001"
      SERVICE_TOKEN: ${SERVICE_TOKEN:-token-servicio-inventarios-2026-vm}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-proveedores}
      DB_USER: ${DB_USER:-proveedores_user}
      DB_PASSWORD: ${DB_PASSWORD:-proveedores_secret_2026}
      SEMBRAR_DATOS: ${SEMBRAR_DATOS:-1}
    ports:
      - "5003:3001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      default:
      redapi:
        aliases:
          - ms-proveedores

  mysql:
    image: mysql:8.4
    container_name: ms-proveedores-mysql
    restart: unless-stopped
    command: --innodb-buffer-pool-size=32M --performance-schema=OFF --max-connections=50
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-proveedores}
      MYSQL_USER: ${DB_USER:-proveedores_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-proveedores_secret_2026}
    ports:
      - "127.0.0.1:33063:3306"
    volumes:
      - ms_proveedores_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  ms_proveedores_mysql:

networks:
  redapi:
    name: redapi
    driver: bridge
