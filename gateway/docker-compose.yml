services:
  app:
    build: .
    image: api-gateway:dev
    container_name: api-gateway-app
    env_file: .env
    environment:
      # Dentro de la red de Compose, MySQL se alcanza por el nombre del servicio
      # y por su puerto interno.
      DB_HOST: mysql
      DB_PORT: "3306"
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      default:
      redapi:
        # Los microservicios y el front lo alcanzan por este nombre
        aliases:
          - api-gateway

  mysql:
    image: mysql:8.4
    container_name: api-gateway-mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_DATABASE:?falta DB_DATABASE en .env}
      MYSQL_USER: ${DB_USERNAME:?falta DB_USERNAME en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:33066:3306"
    volumes:
      - gateway_mysql:/var/lib/mysql
    healthcheck:
      # Usuario de la aplicación: la contraseña de root es aleatoria. Se usa TCP
      # para no dar por sano el servidor temporal de la inicialización.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  gateway_mysql:

networks:
  # Red compartida entre servicios; se crea una vez: docker network create redapi
  redapi:
    external: true
