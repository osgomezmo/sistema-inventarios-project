services:
  app:
    build: .
    image: ms-compras:dev
    container_name: ms-compras-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5000"
      SERVICE_TOKEN: ${SERVICE_TOKEN:-token-servicio-inventarios-2026-vm}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-mscompras}
      DB_USER: ${DB_USER:-compras_user}
      DB_PASSWORD: ${DB_PASSWORD:-compras_secret_2026}
      PROVEEDORES_URL: ${PROVEEDORES_URL:-http://ms-proveedores:3001}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://inventario:inventario_secret@rabbitmq-inventario:5672/%2F}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-inventario.eventos}
      SEMBRAR_DATOS: ${SEMBRAR_DATOS:-1}
    ports:
      - "5004:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      default:
      redapi:
        aliases:
          - ms-compras

  mysql:
    image: mysql:8.4
    container_name: ms-compras-mysql
    restart: unless-stopped
    command: --innodb-buffer-pool-size=32M --performance-schema=OFF --max-connections=50
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-mscompras}
      MYSQL_USER: ${DB_USER:-compras_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-compras_secret_2026}
    ports:
      - "127.0.0.1:33064:3306"
    volumes:
      - ms_compras_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  ms_compras_mysql:

networks:
  redapi:
    name: redapi
    driver: bridge
