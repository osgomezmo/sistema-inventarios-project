services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-inventario
    hostname: rabbitmq-inventario
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-inventario}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-inventario_secret}
    volumes:
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 60s
    networks:
      default:
      redapi:
        aliases:
          - rabbitmq-inventario
          - rabbitmq

volumes:
  rabbitmq_data:

networks:
  redapi:
    name: redapi
    driver: bridge
