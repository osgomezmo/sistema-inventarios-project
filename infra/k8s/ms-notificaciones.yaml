apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-notificaciones-config
  labels:
    app: ms-notificaciones
data:
  PORT: "5006"
  STORAGE_DRIVER: "local"
  PUSH_DRIVER: "console"
  RABBITMQ_URL: "amqp://inventario:inventario_secret@rabbitmq:5672/%2F"
---
apiVersion: v1
kind: Secret
metadata:
  name: ms-notificaciones-secret
  labels:
    app: ms-notificaciones
type: Opaque
stringData:
  SERVICE_TOKEN: "token-secreto-gateway-2026"
  FIREBASE_PROJECT_ID: ""
  FIREBASE_CLIENT_EMAIL: ""
  FIREBASE_PRIVATE_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-notificaciones
  labels:
    app: ms-notificaciones
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-notificaciones
  template:
    metadata:
      labels:
        app: ms-notificaciones
    spec:
      containers:
        - name: ms-notificaciones
          image: ms-notificaciones:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5006
          envFrom:
            - configMapRef:
                name: ms-notificaciones-config
            - secretRef:
                name: ms-notificaciones-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ms-notificaciones
  labels:
    app: ms-notificaciones
spec:
  type: ClusterIP
  selector:
    app: ms-notificaciones
  ports:
    - name: http
      port: 5006
      targetPort: 5006
