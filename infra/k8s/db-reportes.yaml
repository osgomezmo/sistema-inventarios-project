apiVersion: v1
kind: ConfigMap
metadata:
  name: db-reportes-config
  labels:
    app: db-reportes
data:
  MYSQL_DATABASE: "ms_reportes"
  MYSQL_USER: "ms_reportes"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-reportes-secret
  labels:
    app: db-reportes
type: Opaque
stringData:
  MYSQL_PASSWORD: "reportes_secret_2026"
  MYSQL_RANDOM_ROOT_PASSWORD: "yes"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-reportes-pvc
  labels:
    app: db-reportes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-reportes
  labels:
    app: db-reportes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-reportes
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: db-reportes
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          args:
            - "--innodb-buffer-pool-size=32M"
            - "--performance-schema=OFF"
            - "--max-connections=50"
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - configMapRef:
                name: db-reportes-config
            - secretRef:
                name: db-reportes-secret
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - mysqladmin ping -h 127.0.0.1 -u ms_reportes -p$MYSQL_PASSWORD --silent
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - mysqladmin ping -h 127.0.0.1 -u ms_reportes -p$MYSQL_PASSWORD --silent
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: db-reportes-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db-reportes
  labels:
    app: db-reportes
spec:
  type: ClusterIP
  selector:
    app: db-reportes
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
