services:
  app:
    build: .
    image: ms-notificaciones:dev
    container_name: ms-notificaciones-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5006"
      SERVICE_TOKEN: ${SERVICE_TOKEN:-token-servicio-inventarios-2026-vm}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://inventario:inventario_secret@rabbitmq-inventario:5672/%2F}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      PUSH_DRIVER: ${PUSH_DRIVER:-console}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    ports:
      - "5006:5006"
    volumes:
      - ms_notificaciones_data:/app/.data
    networks:
      default:
      redapi:
        aliases:
          - ms-notificaciones

volumes:
  ms_notificaciones_data:

networks:
  redapi:
    name: redapi
    driver: bridge
